<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hashid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0a0e0a;
    --term: #0d120d;
    --line: #16301f;
    --green: #35ff9a;
    --green-dim: #1f9d63;
    --amber: #ffcf6b;
    --red: #ff6b6b;
    --grey: #5a6f61;
    --scan: rgba(53, 255, 154, .03);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--green);
    font-family: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 5vh 16px;
  }
  /* balayage CRT discret */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
  }
  .term {
    width: 100%; max-width: 780px;
    background: var(--term);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 0 0 1px #000, 0 24px 60px -20px rgba(0,0,0,.9),
                0 0 80px -30px var(--green-dim);
    overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: #0a0f0a;
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .bar .path { margin-left: 8px; color: var(--grey); font-size: 12px; }
  .body { padding: 18px 18px 22px; }

  .banner { color: var(--green-dim); white-space: pre; font-size: 12px; margin: 0 0 14px; }
  .hint { color: var(--grey); margin: 0 0 18px; }
  .hint b { color: var(--green-dim); font-weight: 500; cursor: pointer; }
  .hint b:hover { color: var(--green); text-decoration: underline; }

  .prompt { display: flex; align-items: baseline; gap: 8px; }
  .ps1 { color: var(--green-dim); white-space: nowrap; }
  .ps1 .tilde { color: var(--green); }
  #hash {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--green);
    font: inherit; caret-color: var(--green);
    padding: 0;
  }
  #hash::placeholder { color: var(--grey); }

  #out { margin-top: 16px; white-space: pre-wrap; }
  .echo { color: var(--grey); }
  .echo::before { content: "$ "; color: var(--green-dim); }
  .status { color: var(--green-dim); margin: 6px 0 10px; }
  .status.err { color: var(--red); }

  .row {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 10px 14px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line);
  }
  .row:last-child { border-bottom: none; }
  .sc { color: var(--green); font-weight: 700; text-align: right; }
  .nm { font-weight: 500; }
  .cf { font-size: 12px; letter-spacing: .04em; }
  .cf.unique { color: var(--green); }
  .cf.ambigu { color: var(--amber); }
  .cf.fauxami { color: var(--red); }
  .md { grid-column: 2 / 4; color: var(--grey); font-size: 12.5px; }
  .nt { grid-column: 2 / 4; color: var(--green-dim); font-size: 12.5px; font-style: italic; }

  .explain-box { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #ctx {
    flex: 1 1 240px; min-width: 0; padding: 7px 10px;
    background: transparent; border: 1px solid var(--line); border-radius: 5px;
    color: var(--green); font: inherit; font-size: 12.5px; caret-color: var(--green);
  }
  #ctx:focus { outline: none; border-color: var(--green-dim); }
  #ctx::placeholder { color: var(--grey); }
  .cmd {
    cursor: pointer; color: var(--amber); white-space: nowrap;
    border: 1px solid var(--warn-soft); border-radius: 5px; padding: 7px 12px;
  }
  .cmd:hover { background: var(--warn-soft); }
  .explain {
    margin-top: 12px; padding: 12px 14px;
    border-left: 3px solid var(--amber); background: rgba(255, 207, 107, .05);
    color: var(--green); font-size: 13px; white-space: pre-wrap;
  }
  .explain-label { color: var(--amber); font-size: 12px; margin-bottom: 6px; }

  .blink { animation: blink 1.1s step-end infinite; color: var(--green); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<div class="term" id="term">
  <div class="bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="path">AyGoub@hashid: ~</span>
  </div>
  <div class="body">
<pre class="banner">  _               _     _     _
 | |__   __ _ ___| |__ (_) __| |
 | '_ \ / _` / __| '_ \| |/ _` |
 | | | | (_| \__ \ | | | | (_| |
 |_| |_|\__,_|___/_| |_|_|\__,_|  identification de hash</pre>

    <p class="hint">Colle un hash puis Entrée. Essaie&nbsp;:
      <b data-ex="5d41402abc4b2a76b9719d911017c592">md5</b>,
      <b data-ex="aaf4c61ddcc5e8a2dabede0f3b482cd9aea9434d">sha1</b>,
      <b data-ex="$2a$05$LhayLxezLhK1LhWvKxCyLOj0j1u.Kj0jZ0pEmm134uzrQlFvQJLF6">bcrypt</b>
    </p>

    <form id="form" class="prompt" autocomplete="off">
      <span class="ps1">hashid <span class="tilde">~</span> $</span>
      <input id="hash" type="text" placeholder="colle ton hash ici" autofocus
             spellcheck="false" autocapitalize="off">
    </form>

    <div id="out"><span class="blink">_</span></div>
  </div>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("hash");
const out = document.getElementById("out");
const term = document.getElementById("term");

// cliquer n'importe où dans le terminal remet le focus dans le champ
term.addEventListener("click", (e) => {
  if (!e.target.closest("[data-ex]")) input.focus();
});

// les exemples cliquables
document.querySelectorAll("[data-ex]").forEach((el) => {
  el.addEventListener("click", () => {
    input.value = el.dataset.ex;
    input.focus();
    run();
  });
});

form.addEventListener("submit", (e) => { e.preventDefault(); run(); });

async function run() {
  const value = input.value.trim();
  if (!value) { out.innerHTML = '<span class="blink">_</span>'; return; }

  out.innerHTML =
    `<div class="echo">hashid ${escapeHtml(value)}</div>` +
    `<div class="status">analyse en cours…</div>`;

  try {
    const resp = await fetch("/api/identify?hash=" + encodeURIComponent(value));
    const data = await resp.json();

    let html = `<div class="echo">hashid ${escapeHtml(value)}</div>`;
    if (!resp.ok) {
      html += `<div class="status err">erreur : ${escapeHtml(data.error || resp.status)}</div>`;
    } else if (data.count === 0) {
      html += `<div class="status err">aucune correspondance — ce n'est peut-être pas un hash</div>`;
    } else {
      html += `<div class="status">${data.count} candidat(s), du plus au moins probable :</div>`;
      for (const c of data.candidates) {
        const cf = (c.confidence || "").replace("-", "").replace("faux ami", "fauxami");
        html += `<div class="row">
          <span class="sc">[${c.score}]</span>
          <span class="nm">${escapeHtml(c.name)}</span>
          <span class="cf ${cf === "fauxami" ? "fauxami" : cf}">${escapeHtml(c.confidence)}</span>
          <span class="md">hashcat ${fmt(c.hashcat)} · john ${fmt(c.john)}</span>
          ${c.note ? `<span class="nt"># ${escapeHtml(c.note)}</span>` : ""}
        </div>`;
      }
      // bloc explication IA (seulement quand il y a des candidats)
      html += `<div class="explain-box">
        <input id="ctx" type="text" spellcheck="false" autocomplete="off"
               placeholder="contexte optionnel : où as-tu trouvé ce hash ?">
        <span class="cmd" id="explainBtn">$ expliquer avec l'IA</span>
      </div>
      <div id="explain"></div>`;
    }
    html += `<div class="prompt" style="margin-top:12px">
      <span class="ps1">hashid <span class="tilde">~</span> $</span>
      <span class="blink">_</span></div>`;
    out.innerHTML = html;

    // câbler le bouton d'explication (l'élément vient d'être recréé)
    const btn = document.getElementById("explainBtn");
    if (btn) btn.addEventListener("click", () => explain(value));
  } catch (err) {
    out.innerHTML =
      `<div class="echo">hashid ${escapeHtml(value)}</div>` +
      `<div class="status err">connexion à l'API impossible</div>`;
  }
}

async function explain(hash) {
  const ctxEl = document.getElementById("ctx");
  const box = document.getElementById("explain");
  const context = ctxEl ? ctxEl.value.trim() : "";
  box.innerHTML = '<div class="status">génération de l\'explication…</div>';
  try {
    const resp = await fetch("/api/explain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ hash, context }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      box.innerHTML = `<div class="status err"># ${escapeHtml(data.error || "erreur")}</div>`;
      return;
    }
    box.innerHTML =
      `<div class="explain-label"># explication (${escapeHtml(data.model || "IA")})</div>` +
      `<div class="explain">${escapeHtml(data.explanation)}</div>`;
  } catch (err) {
    box.innerHTML = '<div class="status err"># explication indisponible</div>';
  }
}

function fmt(v) { return v == null ? "-" : v; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}
</script>
</body>
</html>
